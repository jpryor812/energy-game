  retire_shares: {value: [0.02, 0.05], status: placeholder, note: "Candidate coal retirements, as shares of current coal capacity."}
  subsidy_share: {value: 0.3, status: placeholder, note: "Subsidy share the AI considers for its cheapest clean source."}
  research_share: {value: 0.05, status: placeholder, note: "Share of capital per research candidate."}
  efficiency_share: {value: 0.1, status: placeholder, note: "Share of capital per efficiency candidate."}
  adaptation_share: {value: 0.05, status: placeholder, note: "Share of capital per adaptation candidate."}
  rebate_share: {value: 0.5, status: placeholder, note: "Rebate share the AI considers once it has raised the carbon price."}
  capital_cost_weight: {value: 1.0, status: placeholder, note: "Utility lost per year of capital income spent (before budget_appetite)."}
  pc_cost_weight: {value: 1.0, status: placeholder, note: "Utility lost per year of political-capital income spent."}
  carbon_response: {value: 0.001, status: placeholder, note: "Estimated long-run share of emissions cut per $/tCO2 of carbon price."}
  gap_scale: {value: 0.1, status: placeholder, note: "Gap to the target path (share of 2025 emissions) that doubles the emissions weight at adherence 1."}
  emissions_weight_floor: {value: 0.0, status: placeholder, note: "Emissions weight never falls below this share of its base value. Zero, so a nation well ahead of its target path stops pushing."}
