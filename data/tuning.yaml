# Global tunables. Every number is a tunable: value, status (placeholder | calibrated), note.
# "calibrated" also covers values fixed by the design doc or taken directly from a cited source.
# Source keys refer to data/SOURCES.md. Units are listed in docs/ASSUMPTIONS.md ("Units").

time:
  start_year:
    value: 2025
    status: calibrated
    note: Fixed by docs/DESIGN.md (game starts 2025Q1). Not a balance parameter.
  turns:
    value: 100
    status: calibrated
    note: Fixed by docs/DESIGN.md (one quarter per turn, 2025Q1 to 2049Q4). Counted in quarters.
  stocktake_interval:
    value: 20
    status: calibrated
    note: Fixed by docs/DESIGN.md (global stocktake every five years, when t % 20 == 19).

seasonality:
  demand_factor:
    value: [1.03, 0.97, 1.01, 0.99]
    status: placeholder
    note: Q1..Q4 demand multipliers (mean 1). Northern-hemisphere winter peak, smaller summer peak.

energy:
  vre_base_absorb_share:
    value: 0.25
    status: placeholder
    note: Share of total primary demand wind and solar can supply before grid or storage is needed.
  vre_max_share_start:
    value: 0.4
    status: placeholder
    note: Most of primary demand wind and solar can serve in 2025 (the electrifiable share).
  vre_max_share_end:
    value: 0.7
    status: placeholder
    note: Same, by the final turn, as electrification spreads.
  clean_max_share_start:
    value: 0.55
    status: placeholder
    note: Most of primary demand all non-fossil sources can serve in 2025 (end-use conversion limits). Just above Brazil's 2024 share (0.52), the highest.
  clean_max_share_end:
    value: 0.95
    status: placeholder
    note: Same, by the final turn. Below 1 so a few percent of hard-to-convert demand stays fossil without new technology.
  fuel_price:
    coal:
      value: 4.2
      unit: $/GJ
      status: placeholder
      note: About $105/t Newcastle 2025 at 25 GJ/t. Unsourced approximate.
    oil:
      value: 11.8
      unit: $/GJ
      status: placeholder
      note: About $69/bbl Brent 2025 average at 5.8 GJ/bbl. Unsourced approximate.
    gas:
      value: 10.5
      unit: $/GJ
      status: placeholder
      note: Between Henry Hub (~$3.5/MMBtu) and TTF/JKM (~$12/MMBtu) 2025, LNG-weighted. Unsourced approximate.

economy:
  capital_share_of_gdp:
    value: 0.02
    unit: fraction of GDP per year
    status: placeholder
    note: Discretionary capital for energy strategy, not total tax revenue (M1 decision 4).
  fossil_revenue_take:
    value: 0.5
    status: placeholder
    note: Share of fossil export revenue reaching the government as discretionary capital.
  interest_rate_hard:
    value: 0.06
    status: placeholder
    note: Annual rate on hard-currency debt taken on during the game.
  interest_rate_local:
    value: 0.05
    status: placeholder
    note: Annual rate on local-currency debt taken on during the game.
  shortfall_drag:
    value: 0.5
    status: placeholder
    note: Growth lost per unit of unmet-demand share (10% shortfall -> -5 pp/yr).
  price_drag:
    value: 0.15
    status: placeholder
    note: Growth lost per unit of energy-price rise above 2025 (doubling -> -15 pp/yr). Raised in M5 (from 0.05) so fast, costly transitions carry an economic price.
  trade_elasticity:
    value: 0.1
    status: placeholder
    note: Growth change per unit change in fossil export value since 2025, as a share of GDP.
  fx_passthrough:
    value: 0.25
    status: placeholder
    note: Share of the change in fossil trade balance since 2025 that moves FX reserves; the exchange rate absorbs the rest.
  stranded_drag:
    value: 0.5
    status: placeholder
    note: Share of written-off book value that is lost from GDP (one-off).
  rebate_price_relief:
    value: 0.8
    status: placeholder
    note: Share of the energy-price drag a full rebate removes.
  debt_drag:
    value: 0.05
    status: placeholder
    note: Growth lost per unit rise in hard-currency debt / GDP above the 2025 ratio.

politics:
  political_capital_start:
    value: 10.0
    status: placeholder
    note: Same for every nation in M2.
  pc_income_base:
    value: 4.0
    status: placeholder
    note: Political capital earned per year at baseline approval.
  pc_income_approval:
    value: 20.0
    status: placeholder
    note: Extra political capital per year per unit of approval above baseline (negative below).
  approval_start:
    value: 0.55
    status: placeholder
    note: Same for every nation in M1; leaders are abstract.
  approval_baseline:
    value: 0.55
    status: placeholder
    note: Level approval drifts back to when nothing is going wrong.
  approval_reversion:
    value: 0.2
    status: placeholder
    note: Fraction of the gap to baseline closed per year.
  approval_shortfall_hit:
    value: 6.0
    status: placeholder
    note: Approval lost per year per unit of shortfall growth drag S. Raised in M5 so neglecting energy security can bring a government down (balance criterion 7).
  approval_price_hit:
    value: 2.0
    status: placeholder
    note: Approval lost per year per unit of price growth drag E.
  approval_damage_hit:
    value: 1.0
    status: placeholder
    note: Approval lost per year per unit of climate damage drag C.
  stability_reversion:
    value: 0.6
    status: placeholder
    note: Fraction of the gap between stability and approval closed per year. Raised in M5 (from 0.25) so a collapse in approval can topple a government before an election.

climate:
  warming_start:
    value: 1.36
    unit: degC above 1850-1900
    status: calibrated
    source: forster2025
    note: Human-induced warming for 2024 (Indicators of Global Climate Change 2024).
  tcre:
    value: 0.45
    unit: degC per 1000 GtCO2
    status: calibrated
    source: ipcc_ar6_wg1
    note: AR6 WG1 best estimate 1.65 degC per 1000 PgC = 0.45 degC per 1000 GtCO2.
  ch4_warming:
    value: 0.5
    status: placeholder
    note: Warming from methane in 2025 (degC). Roughly the IPCC AR6 contribution of methane to warming since 1850-1900. Approximate, not re-checked.
  aerosol_warming:
    value: 0.25
    status: placeholder
    note: Cooling from aerosols linked to coal and oil burning in 2025 (degC, entered as positive). Modest strength by decision (2026-11-08); real estimates of total aerosol cooling are larger.
  other_warming:
    value: 0.05
    status: placeholder
    note: Warming from other non-CO2 gases (nitrous oxide etc.) net of other cooling, held constant. Chosen so non-CO2 warming nets to 0.3 degC in 2025.
  ch4_lifetime:
    value: 12
    unit: years
    status: placeholder
    note: Methane's atmospheric lifetime (about 12 years); the methane index relaxes toward current emissions at this rate.
  ch4_fossil_share:
    value: 0.35
    status: placeholder
    note: Share of human methane from fossil fuels (the rest from farming and waste). Approximate, from Global Methane Budget reporting; not re-checked.
  other_methane_trend:
    value: 0.0
    status: placeholder
    note: Annual change in non-fossil methane per person.
  aerosol_trend:
    value: -0.035
    status: placeholder
    note: Annual fall in aerosols from clean-air policies. Set so business-as-usual warming runs ~0.27 degC/decade (forster2025).
  abatement_max_fossil:
    value: 0.75
    status: placeholder
    note: Most of a nation's fossil methane (leaks, venting) abatement can remove.
  abatement_max_other:
    value: 0.5
    status: placeholder
    note: Most of a nation's farming and waste methane abatement can remove.
  abatement_half_spend:
    value: 0.002
    status: placeholder
    note: Abatement stock, as a share of GDP, that gives half the maximum cut.
  forest_max_cut:
    value: 1.5
    status: placeholder
    note: Most of land-use CO2 the global forest fund can remove; above 1 land becomes a net sink.
  forest_half_fund:
    value: 0.5
    unit: T$
    status: placeholder
    note: Forest fund that gives half of forest_max_cut.
  damage_coefficient:
    value: 0.006
    unit: growth drag per degC^2 at vulnerability 1
    status: placeholder
    note: +0.7 degC above 2025 costs a vulnerability-1 nation ~0.3 pp/yr of growth.
  rest_of_world_co2:
    value: 7867.8
    unit: MtCO2/yr
    status: calibrated
    source: gcb
    note: World fossil-fuel CO2 2024 minus the 16 modelled nations' fossil-fuel CO2.
  rest_of_world_growth:
    value: 0.01
    status: placeholder
    note: Annual growth of energy CO2 outside the 16 modelled nations.
  land_use_co2:
    value: 5025.6
    unit: MtCO2/yr
    status: calibrated
    source: gcb
    note: Mean land-use-change CO2 2015-2024 (annual values are noisy).
  land_use_trend:
    value: -0.01
    status: placeholder
    note: Annual change in global land-use CO2.
  adaptation_max:
    value: 0.5
    status: placeholder
    note: Most adaptation can cut climate damage.
  adaptation_half_spend:
    value: 0.02
    status: placeholder
    note: Adaptation stock, as a share of GDP, that gives half of adaptation_max.
  other_fossil_co2:
    value: 2312.9
    unit: MtCO2/yr
    status: calibrated
    source: gcb
    note: Cement, flaring and other industry CO2, 2024. Held constant.

slots:
  domestic_per_quarter:
    value: 2
    status: placeholder
    note: Build doc placeholder (design doc suggests 3). Unused slots bank with no cap.
  diplomatic_per_quarter:
    value: 1
    status: placeholder
    note: Build doc placeholder (design doc suggests 2).

market:
  cost_weight:
    value: 0.5
    status: placeholder
    note: Weight of levelized cost (vs the 2019-2024 trend mix) in what the market builds.
  cost_temperature:
    value: 3.0
    unit: $/GJ
    status: placeholder
    note: Logit spread; a source this much dearer than the cheapest gets e^-1 of its weight.
  discount_rate:
    value: 0.07
    status: placeholder
    note: Real discount rate for levelized cost. Unsourced approximate.
  reserve_margin:
    value: 0.0
    status: placeholder
    note: Market plans normal output this far above projected demand. Zero, because fossil headroom already covers the seasonal peak (docs/CALIBRATION.md).

research:
  max_cost_cut:
    value: 0.3
    status: placeholder
    note: Most a nation's own research can cut its unit cost for one technology.
  half_effect_spend:
    value: 0.05
    unit: T$
    status: placeholder
    note: Cumulative research spend that gives half of max_cost_cut.
  points_per_trillion:
    value: 1000
    status: placeholder
    note: Tech points per T$ of research (an index for reporting).
  productivity:
    value: 0.1
    status: placeholder
    note: Growth gain per unit of cumulative research spend / GDP.
  productivity_cap:
    value: 0.005
    status: placeholder
    note: Most research can add to annual growth.

actions:
  carbon_price_max:
    value: 300
    unit: $/tCO2
    status: placeholder
    note: Highest carbon price an action can set.
  carbon_pc_per_dollar:
    value: 0.1
    status: placeholder
    note: Political capital per $/t of carbon-price increase.
  retire_pc_per_ej:
    value: 2.0
    status: placeholder
    note: Political capital per EJ/yr of capacity retired early.
  retire_coal_multiplier:
    value: 1.5
    status: placeholder
    note: Coal closures cost this much more political capital (jobs and regions).
  retire_approval_hit:
    value: 0.5
    status: placeholder
    note: Approval lost per unit of fossil capacity retired as a share of demand.
  stranded_value_share:
    value: 0.5
    status: placeholder
    note: Share of replacement cost written off when capacity is retired early (no plant-age data).
  max_subsidy:
    value: 0.9
    status: placeholder
    note: Highest share of a source's build cost the government can subsidise.
  efficiency_max_gain:
    value: 0.3
    status: placeholder
    note: Most cumulative efficiency investment can cut energy intensity (beyond the trend).
  efficiency_scale:
    value: 0.05
    status: placeholder
    note: Cumulative spend, as a share of current GDP, that gives ~63% of efficiency_max_gain.
  influence_per_trillion:
    value: 100
    status: placeholder
    note: Influence points per T$.
  fossil_ban_pc:
    value: 10.0
    status: placeholder
    note: Political capital to ban new fossil plants (the private market stops building them).
  activity_cap_max:
    value: 0.3
    status: placeholder
    note: Highest activity cap (share of energy demand removed).
  activity_pc_cost:
    value: 100
    status: placeholder
    note: Political capital per unit of activity-cap increase (0.1 -> 10).
  activity_gdp_ratio:
    value: 0.5
    status: placeholder
    note: GDP lost per unit of demand removed by the activity cap (energy-intensive output is half as GDP-intensive).
  activity_approval_hit:
    value: 0.5
    status: placeholder
    note: Approval lost per year per unit of activity cap in force.

scoring:
  weight_income:
    value: 0.25
    status: placeholder
    note: Nation Index weight. Tuned in M5 (income 0.25, climate 0.15, others 0.2) so economic costs weigh against climate gains (criterion 3).
  weight_security:
    value: 0.2
    status: placeholder
    note: Nation Index weight.
  weight_welfare:
    value: 0.2
    status: placeholder
    note: Nation Index weight.
  weight_clean:
    value: 0.2
    status: placeholder
    note: Nation Index weight.
  weight_climate:
    value: 0.15
    status: placeholder
    note: Nation Index weight for climate contribution (added 2026-11-08).
  climate_scale:
    value: 0.2
    status: placeholder
    note: Credit-weighted average yearly cut (share of 2025 emissions) that moves the climate score from 0.5 to 0.73.
  bonus_best_deal:
    value: 3.0
    status: placeholder
    note: Flat bonus to both parties of the deal that cut the most emissions.
  weight_absolute:
    value: 0.5
    status: placeholder
    note: Weight of the absolute index in the score (decided 2026-11-08).
  weight_relative:
    value: 0.5
    status: placeholder
    note: Weight of the relative index (x country difficulty) in the score.
  abs_weight_income:
    value: 0.3
    status: placeholder
    note: Absolute index weight. Tuned in M5 so economic outcomes balance climate ones (criterion 3).
  abs_weight_clean_share:
    value: 0.15
    status: placeholder
    note: Absolute index weight.
  abs_weight_emissions:
    value: 0.15
    status: placeholder
    note: Absolute index weight.
  abs_weight_security:
    value: 0.2
    status: placeholder
    note: Absolute index weight.
  abs_weight_approval:
    value: 0.2
    status: placeholder
    note: Absolute index weight.
  abs_income_scale:
    value: 1.0
    status: placeholder
    note: log(income per person / 16-nation average) that moves the absolute income score from 0.5 to 0.73.
  difficulty_easy:
    value: 1.0
    status: placeholder
    note: Country difficulty multiplier on the relative index and relative bonuses (decided 2026-11-08).
  difficulty_easy_to_medium:
    value: 1.1
    status: placeholder
    note: Country difficulty multiplier.
  difficulty_medium:
    value: 1.15
    status: placeholder
    note: Country difficulty multiplier.
  difficulty_hard:
    value: 1.3
    status: placeholder
    note: Country difficulty multiplier.
  bonus_largest_cut:
    value: 3.0
    status: placeholder
    note: Absolute bonus for the largest cut in tonnes.
  bonus_clean_gain:
    value: 3.0
    status: placeholder
    note: Relative bonus (x difficulty) for the largest gain in clean share of energy.
  income_scale:
    value: 0.1
    status: placeholder
    note: log(actual / baseline-expected income per person) that moves the income score from 0.5 to 0.73.
  shortfall_zero:
    value: 0.05
    status: placeholder
    note: Average shortfall share that scores zero on supply security.
  import_scale:
    value: 0.1
    status: placeholder
    note: Change in import dependence that moves the import score from 0.5 to 0.27 or 0.73.
  price_scale:
    value: 0.3
    status: placeholder
    note: log(end price / start price) that moves the price score from 0.5 to 0.27 or 0.73.
  clean_scale:
    value: 0.7
    status: placeholder
    note: log(world clean-tech manufacturing share now / 2025) that moves the clean score from 0.5 to 0.73 (doubling the share scores ~0.73).
  clean_share_floor:
    value: 0.01
    status: placeholder
    note: Added to manufacturing shares before comparing, so a nation with no factories in 2025 can gain by building some.
  world_good:
    value: 1.5
    unit: degC
    status: placeholder
    note: World multiplier is 1.0 at or below this warming (1.5 degC goal, decided 2026-11-08).
  world_bad:
    value: 2.5
    unit: degC
    status: placeholder
    note: World multiplier reaches its floor at this warming.
  world_floor:
    value: 0.1
    status: placeholder
    note: Lowest world multiplier.
  good_world_warming:
    value: 1.5
    unit: degC
    status: placeholder
    note: Final warming at or below this counts as a good world outcome for endings (the 1.5 degC goal).
  top_rank:
    value: 4
    status: placeholder
    note: Rank on the Nation Index (out of 16) that counts as a top finish for endings.
  fallen_stability:
    value: 0.1
    status: placeholder
    note: Stability below this ends the game early (Fallen Government).
  net_zero_share:
    value: 0.05
    status: placeholder
    note: Emissions at or below this share of 2025 count as net zero.
  bonus_first_net_zero:
    value: 3.0
    status: placeholder
    note: Flat bonus points.
  bonus_largest_reduction:
    value: 3.0
    status: placeholder
    note: Flat bonus points.

