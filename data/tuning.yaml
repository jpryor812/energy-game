      deal_affinity: {value: 1.0, status: placeholder, note: "Extra utility for signing deals (scaled by w_deals)."}
      w_growth: {value: 1.0, status: placeholder, note: "Weight on estimated growth effects (per pp/yr)."}
      w_security: {value: 1.0, status: placeholder, note: "Weight on estimated energy-security effects (per pp of demand)."}
