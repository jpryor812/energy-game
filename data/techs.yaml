# Energy sources and enablers. Categories come from docs/BUILD_SIM_V0.md ("Sources"), plus
# other_renewables (bioenergy, geothermal, other), which the data needs; see ASSUMPTIONS.md.
#
# Units: energy is primary energy, input-equivalent ("substitution method") for non-fossil
# sources, as in the Energy Institute / OWID data. Capacity is maximum output in EJ/yr.
#   variable_cost    $/GJ primary (fuel + variable O&M)
#   emission_factor  MtCO2/EJ (= kg/GJ)
#   build_time       quarters
#   permitting_share share of build_time that is permits and approvals (M10)
#   lifespan         years
#   capital_cost     T$ per EJ/yr of capacity, derived from $/kW, capacity factor and a 40%
#                    input-equivalent efficiency for non-fossil power
#   learning_rate    cost reduction per doubling of global deployment
#   headroom         maximum output / normal output (spare capacity at t=0)
#   global_installed 2025 world output (EJ/yr): the learning-curve starting point n0
#   coverage_share   the 16 modelled nations' share of world use of that source
#   equipment_share  share of build cost bought from manufacturers (solar, wind, storage only)
#   carbon_removal   capacity in MtCO2/yr removed; energy_use in EJ per MtCO2

