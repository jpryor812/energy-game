# Nations in the simulation. IDs are ISO 3166-1 alpha-3; the EU uses the World Bank aggregate
# code EUU. Archetype and difficulty are design intent from docs/DESIGN.md, not real-world data.
#
# M0: structural fields only. Starting economic and energy values (GDP, population, capacity by
# source, emissions, ...) are added in M1, each as a tunable with a source in data/SOURCES.md.
# Personalities are assigned in M3.

nations:
  USA:
    name: United States
    playable: true
    archetype: Capital-rich, politically volatile
    difficulty: easy
    personality: null
