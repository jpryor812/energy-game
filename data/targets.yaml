# Assumed emissions target path for each nation (M3).
#
# These are design assumptions, not real pledges: each path reflects the nation's general
# climate-policy stance over roughly 2005-2025 (see docs/ASSUMPTIONS.md). Levels are a share of
# the nation's 2025 energy CO2, reached in the matching year; the path is linear from 1.0 in
# 2025 between waypoints and flat after the last one. How closely an AI nation follows its path
# depends on its personality (tuning.yaml, ai.personalities).

targets:
  EUU:
    stance: "Consistently ambitious"
    years: {value: [2030, 2040, 2050], status: placeholder, note: "Assumed from policy stance: Consistently ambitious."}
    levels: {value: [0.72, 0.25, 0.05], status: placeholder, unit: share of 2025 energy CO2, note: "Assumed from policy stance: Consistently ambitious."}
